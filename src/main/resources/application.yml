server:
  port: 8888
  servlet:
    context-path: /bank-service

spring:
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/bank
    username: admin
    password: admin
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
